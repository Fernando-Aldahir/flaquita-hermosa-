<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100820">
<title>Para mi Flaquita 💜</title>
<style>
:root{--violet:#a66cff;--lilac:#d7b5ff;--deep:#100820;--pink:#ffb8e9;--gold:#ffd98b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;color:#fff;background:radial-gradient(ellipse at 50% 43%,#291044 0%,#160a29 42%,#080510 100%);touch-action:pan-y}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.scene{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;perspective:1000px;perspective-origin:50% 43%}
.nebula{position:absolute;width:min(70vw,650px);height:min(70vw,650px);left:50%;top:43%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(164,91,255,.18),rgba(112,49,190,.08) 42%,transparent 70%);filter:blur(8px);animation:breathe 5s ease-in-out infinite}
.orbit{position:absolute;left:50%;top:43%;width:min(90vw,760px);height:min(90vw,760px);max-height:82vh;max-width:82vh;transform:translate(-50%,-50%) rotateX(64deg);border:1px solid rgba(207,164,255,.18);border-radius:50%;box-shadow:0 0 30px rgba(150,83,255,.12),inset 0 0 30px rgba(150,83,255,.08);pointer-events:none}
.orbit.two{width:min(112vw,940px);height:min(112vw,940px);max-height:100vh;max-width:100vh;transform:translate(-50%,-50%) rotateX(64deg) rotateZ(22deg);border-color:rgba(255,190,247,.1)}
.heart-wrap{position:absolute;left:50%;top:43%;width:clamp(150px,24vw,245px);height:clamp(150px,24vw,245px);transform:translate(-50%,-50%);display:grid;place-items:center;z-index:2;filter:drop-shadow(0 0 18px rgba(177,108,255,.75));animation:heartFloat 5s ease-in-out infinite;transition:transform .25s ease}
.heart-wrap::before{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(164,94,255,.28),rgba(164,94,255,.09) 38%,transparent 68%);animation:pulseGlow 3s ease-in-out infinite}
.heart{position:relative;width:67%;height:67%;background:linear-gradient(145deg,#e0baff 0%,#bd81ff 28%,#8a43ed 61%,#5a21b8 100%);transform:rotate(-45deg);border-radius:18% 0 18% 8%;box-shadow:inset -12px -10px 20px rgba(46,8,97,.35),inset 8px 8px 15px rgba(255,255,255,.35),0 0 35px rgba(169,104,255,.65);animation:heartBeat 2.3s ease-in-out infinite}
.heart:before,.heart:after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;background:inherit}
.heart:before{top:-50%;left:0}.heart:after{left:50%;top:0}
.heart-core{position:absolute;z-index:2;font-size:clamp(19px,3vw,30px);text-shadow:0 0 16px #fff,0 0 30px #d9b3ff;animation:twinkle 2s infinite}
.center-caption{position:absolute;top:calc(43% + clamp(100px,15vw,145px));left:50%;transform:translateX(-50%);width:90%;text-align:center;z-index:3;pointer-events:none}
.center-caption .small{font:600 10px/1.5 Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#c9a4ff}
.center-caption h1{font-size:clamp(23px,4vw,39px);font-weight:normal;line-height:1.1;margin:7px 0 5px;text-shadow:0 0 22px #a66cff}
.center-caption p{font:12px Arial,sans-serif;color:#e2d1f8;letter-spacing:.06em;margin:0}
.message{position:absolute;left:50%;top:43%;z-index:4;transform-style:preserve-3d;transform-origin:center center;border:1px solid rgba(223,195,255,.15);background:rgba(26,12,43,.32);backdrop-filter:blur(3px);color:#f3e6ff;border-radius:999px;padding:9px 14px;font-size:clamp(12px,1.6vw,16px);white-space:nowrap;cursor:pointer;user-select:none;box-shadow:0 0 16px rgba(164,103,255,.12);transition:background .3s,border-color .3s,box-shadow .3s,filter .3s;outline:none;will-change:transform,opacity}
.message:hover,.message:focus-visible{background:rgba(114,59,169,.6);border-color:#d5b5ff;box-shadow:0 0 25px rgba(191,145,255,.5);color:white}
.message .spark{color:#d6b0ff;margin-left:6px}
.message:nth-child(odd){color:#ffe7ff}
.flower{position:absolute;z-index:1;color:var(--gold);opacity:.7;filter:drop-shadow(0 0 8px rgba(255,217,139,.7));animation:spin 24s linear infinite;pointer-events:none}
.hint{position:absolute;bottom:25px;left:0;right:0;text-align:center;color:#bba6d5;font:11px Arial,sans-serif;letter-spacing:.12em;opacity:.85;z-index:5}
.hint span{display:inline-block;margin:0 6px;color:#e4cfff}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:22px;background:rgba(7,3,15,0);opacity:0;pointer-events:none;transition:background .55s,opacity .4s}
.modal.open{background:rgba(7,3,15,.78);opacity:1;pointer-events:auto;backdrop-filter:blur(9px)}
.note{position:relative;width:min(540px,92vw);min-height:260px;padding:clamp(28px,7vw,54px) clamp(22px,6vw,48px);border:1px solid rgba(221,190,255,.65);border-radius:28px;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(139,77,202,.32),transparent 60%),linear-gradient(145deg,#241337,#130b21 75%);box-shadow:0 0 70px rgba(149,85,236,.35),inset 0 0 28px rgba(180,131,255,.07);transform:translateY(45px) scale(.68) rotate(-3deg);opacity:0;transition:transform .65s cubic-bezier(.2,.85,.2,1.2),opacity .35s}
.modal.open .note{transform:translateY(0) scale(1) rotate(0);opacity:1}
.note::before{content:"✦";position:absolute;top:18px;left:22px;color:#d8b8ff;font-size:18px}.note::after{content:"✦";position:absolute;bottom:18px;right:22px;color:#d8b8ff;font-size:18px}
.close{position:absolute;right:13px;top:12px;width:36px;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(255,255,255,.08);color:white;font-size:24px;line-height:1;cursor:pointer;transition:transform .3s,background .3s}
.close:hover{transform:rotate(90deg);background:rgba(185,134,255,.3)}
.note-icon{font-size:34px;margin:0 0 15px;filter:drop-shadow(0 0 12px #b37cff)}
.note h2{font-weight:normal;font-size:clamp(23px,5vw,34px);line-height:1.25;margin:0 0 18px;color:#f5eaff;text-shadow:0 0 22px rgba(190,143,255,.5)}
.note p{font-size:15px;line-height:1.8;color:#d9c7ef;margin:0 auto;max-width:390px}
.note .signature{margin-top:24px;color:#d6b2ff;font-style:italic;font-size:17px}
.footer-star{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);color:rgba(221,190,255,.3);font-size:12px;letter-spacing:10px;white-space:nowrap}
@keyframes heartBeat{0%,100%{transform:rotate(-45deg) scale(1)}8%{transform:rotate(-45deg) scale(1.06)}16%{transform:rotate(-45deg) scale(1)}24%{transform:rotate(-45deg) scale(1.035)}34%{transform:rotate(-45deg) scale(1)}}
@keyframes heartFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes pulseGlow{0%,100%{transform:scale(.88);opacity:.65}50%{transform:scale(1.1);opacity:1}}
@keyframes breathe{0%,100%{opacity:.6;scale:.9}50%{opacity:1;scale:1.1}}
@keyframes twinkle{0%,100%{opacity:.7;scale:.9}50%{opacity:1;scale:1.15}}
@keyframes drift{0%{translate:0 0;rotate:-2deg}100%{translate:var(--dx,12px) var(--dy,-14px);rotate:2deg}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.orbit{width:90vw;height:90vw;max-width:82vh;max-height:82vh}.orbit.two{width:110vw;height:110vw}.message{padding:8px 10px;font-size:11px;white-space:normal;max-width:48vw;text-align:center}.center-caption{top:calc(43% + 94px)}.center-caption p{font-size:10px}.hint{bottom:15px;font-size:9px}.heart-wrap{top:41%}.center-caption{top:calc(41% + 100px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main class="scene" id="scene" aria-label="Un universo morado para Fernanda">
  <div class="nebula"></div><div class="orbit"></div><div class="orbit two"></div>
  <div class="heart-wrap" id="heartWrap" aria-hidden="true"><div class="heart"></div><div class="heart-core">✦</div></div>
  <div class="center-caption"><div class="small">un universo para ti</div><h1>Flaquita 💜</h1><p>mi lugar bonito en este universo</p></div>
  <div class="footer-star">✧　✦　✧　✦　✧</div>
  <div class="hint">TOCA UN MENSAJITO PARA ABRIRLO <span>✦</span> MUEVE TU DEDO O CURSOR</div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
  <article class="note"><button class="close" id="close" aria-label="Cerrar mensaje">×</button><div class="note-icon">💜</div><h2 id="noteTitle"></h2><p id="noteText"></p><div class="signature">— para mi Flaquita ✨</div></article>
</div>
<script>
(() => {
const messages = [
 ["Te quiero con todo mi corazón 💜","Si pudiera guardar mis sentimientos en un lugar, elegiría este pequeño universo para que siempre supieras cuánto te quiero."],
 ["Mi Flaquita bonita ✨","Tienes esa forma tan tuya de hacer que hasta los días más normales se sientan especiales. Qué bonito coincidir contigo."],
 ["Eres mi casualidad favorita 🌙","Entre tantas personas y tantos caminos, qué suerte la mía de haberte encontrado en aquel bagon."],
 ["Un corazón morado, para ti 💜","Este corazoncito es como nuestro sol: puede que todo alrededor cambie, pero siempre tendrá un brillo que me recuerda a ti."],
 ["¿Vemos El libro de la vida? 🌼","Contigo hasta una película que ya conocemos se siente diferente. Me gusta imaginar nuestros propios momentos mágicos, como en nuestra película."],
 ["Te adoro, Fer 🪻","Ojalá pudieras verte un ratito con mis ojos para entender lo especial y bonita que eres para mí."],
 ["Mi lugar bonito eres tú 🫶","No necesito un lugar perfecto; me basta con compartir risas, pláticas y ratitos contigo aunque sea por llamada."],
 ["Para ti, hoy y muchos días 💫","Este universo está lleno de estrellitas, pero mi favorita siempre será la que me recuerda a ti."],
 ["Un abrazo que dure mucho 🤍","Si estuvieras aquí, te daría uno de esos abrazos que dicen sin palabras: qué gusto tenerte cerquita."],
 ["Qué bonito es quererte 💜","No hace falta decir cosas enormes; me gusta demostrártelo poquito a poquito, con cariño sincero y detalles."],
 ["Mi personita especial 🌷","Gracias por ser tú, por tus ocurrencias y por esos momentos que se me quedan guardados con una sonrisa."],
 ["Siempre hay una estrellita para ti ✦","Cuando veas el cielo, imagina que una de estas lucecitas lleva un mensajito mío: te quiero mucho, Flaquita."]
];
const scene=document.getElementById('scene'), modal=document.getElementById('modal'), title=document.getElementById('noteTitle'), text=document.getElementById('noteText');
let opened=null, pointer={x:0,y:0}, animationFrame;
const rand=(a,b)=>Math.random()*(b-a)+a;
messages.forEach((item,i)=>{
 const el=document.createElement('button');el.className='message';el.type='button';el.innerHTML=item[0]+' <span class="spark">✦</span>';
 el.dataset.index=i;
 el.addEventListener('click',()=>openMessage(i,el));scene.appendChild(el);
});
function openMessage(i,el){opened=el;title.textContent=messages[i][0].replace(/[💜✨🌙🌼🪻🫶💫🤍🌷✦]/gu,'').trim();text.textContent=messages[i][1];modal.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus();}
function closeMessage(){if(!modal.classList.contains('open'))return;modal.classList.remove('open');document.body.style.overflow='';if(opened){opened.animate([{transform:'scale(1.14)',filter:'brightness(1.7)'},{transform:'scale(1)',filter:'brightness(1)'}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'});opened.focus({preventScroll:true});}opened=null;}
document.getElementById('close').addEventListener('click',closeMessage);
modal.addEventListener('click',e=>{if(e.target===modal)closeMessage()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMessage()});

let orbitAngle=0, lastOrbit=0;
function animateOrbit(timestamp){
 if(!lastOrbit) lastOrbit=timestamp;
 const delta=Math.min(40,timestamp-lastOrbit);lastOrbit=timestamp;
 if(!modal.classList.contains('open')) orbitAngle += delta*0.00016;
 const items=[...scene.querySelectorAll('.message')];
 const mobile=innerWidth<600;
 const rx=Math.min(innerWidth*(mobile?.37:.39),mobile?190:330);
 const rz=Math.min(innerHeight*(mobile?.22:.25),mobile?155:230);
 const cy=innerHeight*.43;
 items.forEach((el,i)=>{
   const a=(i/items.length)*Math.PI*2+orbitAngle;
   const x=Math.cos(a)*rx;
   const depth=Math.sin(a);
   const y=Math.sin(a)*rz;
   const scale=.72+(depth+1)*.19;
   const z=depth*170;
   el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) scale(${scale})`;
   el.style.opacity=String(.52+(depth+1)*.24);
   el.style.zIndex=String(10+Math.round((depth+1)*10));
   el.style.filter=`brightness(${.72+(depth+1)*.25})`;
   el.style.pointerEvents=modal.classList.contains('open')?'none':'auto';
 });
 requestAnimationFrame(animateOrbit);
}
requestAnimationFrame(animateOrbit);

scene.addEventListener('pointermove',e=>{pointer.x=(e.clientX/innerWidth-.5);pointer.y=(e.clientY/innerHeight-.5);const heart=document.getElementById('heartWrap');heart.style.transform=`translate(calc(-50% + ${pointer.x*15}px),calc(-50% + ${pointer.y*12}px))`;const orbitEls=scene.querySelectorAll('.message');orbitEls.forEach(m=>{m.style.textShadow=`${pointer.x*4}px ${pointer.y*4}px 16px rgba(194,145,255,.35)`;});scene.querySelectorAll('.orbit').forEach((o,i)=>{o.style.marginLeft=(pointer.x*(i?8:5))+'px';o.style.marginTop=(pointer.y*(i?6:4))+'px';});});
scene.addEventListener('pointerleave',()=>{document.getElementById('heartWrap').style.transform='translate(-50%,-50%)';scene.querySelectorAll('.message').forEach(m=>{m.style.textShadow='';});scene.querySelectorAll('.orbit').forEach(o=>{o.style.marginLeft='';o.style.marginTop='';});});
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let stars=[];
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:Math.min(190,Math.floor(innerWidth*innerHeight/5000))},()=>({x:rand(0,innerWidth),y:rand(0,innerHeight),r:rand(.4,1.7),a:rand(.12,.8),s:rand(.003,.014),phase:rand(0,6)}));}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){s.phase+=s.s;const alpha=s.a*(.55+.45*Math.sin(s.phase));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(${Math.random()>.985?'224,190,255':'192,151,255'},${alpha})`;ctx.fill();}animationFrame=requestAnimationFrame(draw);}
window.addEventListener('resize',resize);resize();draw();
const flowers=['✿','✧','❋','✦','❀'];for(let i=0;i<13;i++){const f=document.createElement('div');f.className='flower';f.textContent=flowers[i%flowers.length];f.style.left=rand(4,96)+'%';f.style.top=rand(7,88)+'%';f.style.fontSize=rand(10,23)+'px';f.style.animationDelay=(-rand(0,20))+'s';scene.appendChild(f);}
})();
</script>
</body>
</html>
